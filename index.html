<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Варвара</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-app: #0f1117; --bg-sidebar: #13151f; --bg-main: #0f1117;
  --bg-card: #1a1d2e; --bg-input: #1e2132; --bg-hover: #1e2235;
  --accent: #818cf8; --accent-hover: #6366f1; --accent-light: #a5b4fc;
  --accent-dim: rgba(129,140,248,0.12);
  --text-primary: #f0efff; --text-secondary: #8b92b8; --text-muted: #4a506e;
  --border: #1e2236; --border-hover: #2d3358;
  --success: #10b981; --danger: #ef4444; --scrollbar: #2a2f4a;
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-app);color:var(--text-primary);font-size:14px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#3a3a60}
.app{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{width:220px;min-width:220px;background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 0}
.sidebar-logo{display:flex;align-items:center;gap:12px;padding:14px 16px 18px;border-bottom:1px solid var(--border);margin-bottom:12px}
.varvara-avatar{width:44px;height:44px;flex-shrink:0}
.sidebar-logo .logo-text{font-size:15px;font-weight:700;color:var(--accent-light);letter-spacing:.5px}
.sidebar-logo .logo-sub{font-size:10px;color:var(--text-muted);display:block;margin-top:1px;font-weight:400}
.sidebar-section-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);padding:0 16px 8px}
.projects-list{flex:1;overflow-y:auto;padding:0 8px}
.project-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;transition:background .15s;color:var(--text-secondary);margin-bottom:2px}
.project-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.project-item.active{background:var(--accent-dim);color:var(--text-primary)}
.project-item-icon{font-size:16px;flex-shrink:0}
.project-item-name{font-size:13px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-hidden-toggle{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--text-muted);font-size:12px;transition:color .15s;margin:0 8px}
.sidebar-hidden-toggle:hover{color:var(--text-secondary)}
.sidebar-footer{padding:12px 8px 0;border-top:1px solid var(--border);margin-top:8px}
.btn-add-project{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border:1px dashed var(--border-hover);border-radius:8px;background:transparent;color:var(--text-muted);font-size:13px;cursor:pointer;transition:all .15s}
.btn-add-project:hover{border-color:var(--accent);color:var(--accent-light);background:var(--accent-dim)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-main)}
.project-header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);min-height:60px;flex-shrink:0}
.project-title{display:flex;align-items:center;gap:10px}
.project-title-icon{font-size:20px}
.project-title-name{font-size:16px;font-weight:700}
.tabs{display:flex;gap:4px}
.tab{padding:7px 16px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--text-secondary);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.tab:hover{color:var(--text-primary);background:var(--bg-hover)}
.tab.active{background:var(--accent-dim);color:var(--accent-light);border-color:rgba(129,140,248,.3)}
.tab-content{display:none;flex:1;overflow:hidden}
.tab-content.active{display:flex;flex-direction:column}

/* EMPTY STATE */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted);gap:12px}
.empty-state-icon{font-size:48px;opacity:.3}
.empty-state-text{font-size:14px}

/* CHAT */
.chat-messages{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.message{display:flex;gap:12px;max-width:85%}
.message.user{flex-direction:row-reverse;align-self:flex-end}
.message.assistant{align-self:flex-start}
.message-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:2px}
.message.user .message-avatar{background:var(--accent)}
.message.assistant .message-avatar{background:var(--bg-card);border:1px solid var(--border-hover)}
.message-bubble{padding:12px 16px;border-radius:12px;line-height:1.6;font-size:14px}
.message.user .message-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.message.assistant .message-bubble{background:var(--bg-card);color:var(--text-primary);border-bottom-left-radius:4px;border:1px solid var(--border)}
.message.assistant .message-bubble p{margin:0 0 8px}
.message.assistant .message-bubble p:last-child{margin:0}
.message.assistant .message-bubble strong{color:var(--accent-light)}
.message.assistant .message-bubble code{background:var(--bg-input);padding:2px 6px;border-radius:4px;font-family:monospace;font-size:12px}
.message.assistant .message-bubble pre{background:var(--bg-input);padding:12px;border-radius:8px;overflow-x:auto;margin:8px 0}
.message.assistant .message-bubble ul,.message.assistant .message-bubble ol{padding-left:20px}
.message.assistant .message-bubble li{margin:4px 0}
.message.assistant .message-bubble table{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px}
.message.assistant .message-bubble th,.message.assistant .message-bubble td{border:1px solid var(--border-hover);padding:6px 10px}
.message.assistant .message-bubble th{background:var(--bg-input);color:var(--accent-light)}
.message.assistant .message-bubble h1,.message.assistant .message-bubble h2,.message.assistant .message-bubble h3{color:var(--accent-light);margin:12px 0 6px}
.thinking-indicator{display:flex;align-items:center;gap:10px;color:var(--text-muted);font-size:13px;align-self:flex-start}
.thinking-dots{display:flex;gap:4px}
.thinking-dots span{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:bounce 1.2s infinite;opacity:.6}
.thinking-dots span:nth-child(2){animation-delay:.2s}
.thinking-dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px);opacity:1}}
.task-created-notice{display:flex;align-items:center;gap:8px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:8px;padding:8px 12px;font-size:12px;color:#10b981;margin-top:4px;align-self:flex-start;max-width:85%}
.chat-input-area{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:12px;align-items:flex-end;flex-shrink:0}
#chatInput{flex:1;background:var(--bg-input);border:1px solid var(--border-hover);border-radius:12px;padding:12px 16px;color:var(--text-primary);font-size:14px;resize:none;max-height:150px;min-height:46px;font-family:inherit;line-height:1.5;outline:none;transition:border-color .15s}
#chatInput:focus{border-color:var(--accent)}
#chatInput::placeholder{color:var(--text-muted)}
.btn-send{width:46px;height:46px;border-radius:12px;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;color:#fff}
.btn-send:hover{background:var(--accent-hover)}
.btn-send:disabled{opacity:.5;cursor:not-allowed}
.btn-send svg{width:18px;height:18px}

/* KANBAN */
.kanban-wrapper{flex:1;overflow:hidden;display:flex;flex-direction:column}
.kanban-toolbar{display:flex;align-items:center;justify-content:flex-end;padding:14px 24px 10px;gap:8px;flex-shrink:0}
.btn-primary{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:500;cursor:pointer;transition:background .15s}
.btn-primary:hover{background:var(--accent-hover)}
.kanban-board{flex:1;overflow-x:auto;overflow-y:hidden;padding:0 24px 24px;display:flex;gap:12px;align-items:flex-start}
.kanban-column{min-width:250px;max-width:250px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 178px)}
.column-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.column-title{font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px}
.column-count{font-size:11px;color:var(--text-muted);background:var(--bg-input);border-radius:10px;padding:1px 7px;min-width:20px;text-align:center}
.column-cards{flex:1;overflow-y:auto;padding:10px 10px 6px;display:flex;flex-direction:column;gap:8px}
.task-card{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;transition:border-color .15s,box-shadow .15s}
.task-card:hover{border-color:var(--border-hover);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.task-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.task-card-title{font-size:13px;line-height:1.5;color:var(--text-primary);flex:1;cursor:text;word-break:break-word}
.task-card-title:focus{outline:1px solid var(--accent);border-radius:4px;padding:2px 4px}
.task-card-delete{width:20px;height:20px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:color .15s,background .15s;opacity:0}
.task-card:hover .task-card-delete{opacity:1}
.task-card-delete:hover{color:var(--danger);background:rgba(239,68,68,.1)}
.task-card-agent{display:inline-block;font-size:11px;color:var(--accent-light);background:var(--accent-dim);border-radius:4px;padding:2px 7px;margin-top:6px}
.task-card-agent:empty{display:none}
.task-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.task-card-date{font-size:11px;color:var(--text-muted)}
.task-card-nav{display:flex;gap:4px}
.task-nav-btn{width:24px;height:24px;border:1px solid var(--border-hover);background:transparent;border-radius:5px;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s}
.task-nav-btn:hover{border-color:var(--accent);color:var(--accent-light);background:var(--accent-dim)}
.task-nav-btn:disabled{opacity:.2;cursor:not-allowed}
.column-add-form{padding:0 10px 10px;flex-shrink:0}
.column-add-btn{width:100%;padding:8px;border:1px dashed var(--border);border-radius:7px;background:transparent;color:var(--text-muted);font-size:12px;cursor:pointer;transition:all .15s;text-align:left}
.column-add-btn:hover{border-color:var(--accent);color:var(--accent-light);background:var(--accent-dim)}
.column-add-input-wrap{display:none}
.column-add-input-wrap.visible{display:flex;flex-direction:column;gap:6px}
.column-add-input{width:100%;background:var(--bg-input);border:1px solid var(--accent);border-radius:7px;padding:8px 10px;color:var(--text-primary);font-size:13px;font-family:inherit;resize:none;outline:none}
.column-add-actions{display:flex;gap:6px}
.btn-save-task{flex:1;padding:6px;background:var(--accent);border:none;border-radius:6px;color:#fff;font-size:12px;cursor:pointer}
.btn-save-task:hover{background:var(--accent-hover)}
.btn-cancel-task{padding:6px 10px;background:transparent;border:1px solid var(--border-hover);border-radius:6px;color:var(--text-muted);font-size:12px;cursor:pointer}
.btn-cancel-task:hover{color:var(--text-primary)}
.priority-select{background:var(--bg-input);border:1px solid var(--border-hover);border-radius:6px;padding:5px 8px;color:var(--text-secondary);font-size:12px;font-family:inherit;outline:none;cursor:pointer;transition:border-color .15s}
.priority-select:focus{border-color:var(--accent)}
/* Priority badges */
.priority-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;border-radius:4px;padding:2px 7px;cursor:pointer;transition:opacity .15s;user-select:none}
.priority-badge:hover{opacity:.8}
.priority-badge.critical{background:rgba(239,68,68,.15);color:#f87171}
.priority-badge.high{background:rgba(251,146,60,.15);color:#fb923c}
.priority-badge.medium{background:rgba(250,204,21,.12);color:#fbbf24}
.priority-badge.low{background:rgba(96,165,250,.12);color:#60a5fa}
.priority-badge.someday{background:rgba(100,116,139,.12);color:#94a3b8}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.modal-overlay.hidden{display:none}
.modal{background:var(--bg-card);border:1px solid var(--border-hover);border-radius:14px;padding:24px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h3{font-size:16px;font-weight:600;margin-bottom:20px}
.modal-field{margin-bottom:14px}
.modal-field label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:6px}
.modal-field input{width:100%;background:var(--bg-input);border:1px solid var(--border-hover);border-radius:8px;padding:10px 12px;color:var(--text-primary);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
.modal-field input:focus{border-color:var(--accent)}
.modal-icons{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.icon-option{width:38px;height:38px;border-radius:8px;border:2px solid var(--border);background:transparent;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.icon-option:hover{border-color:var(--accent);background:var(--accent-dim)}
.icon-option.selected{border-color:var(--accent);background:var(--accent-dim)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.btn-modal-cancel{padding:9px 16px;background:transparent;border:1px solid var(--border-hover);border-radius:8px;color:var(--text-secondary);font-size:13px;cursor:pointer}
.btn-modal-cancel:hover{color:var(--text-primary)}
.btn-modal-create{padding:9px 16px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:500;cursor:pointer}
.btn-modal-create:hover{background:var(--accent-hover)}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg-card);border:1px solid var(--border-hover);border-radius:10px;padding:12px 18px;font-size:13px;color:var(--text-primary);box-shadow:0 8px 24px rgba(0,0,0,.4);transform:translateY(80px);opacity:0;transition:all .3s;z-index:200;pointer-events:none;max-width:320px}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-color:rgba(16,185,129,.4);color:#10b981}
.toast.error{border-color:rgba(239,68,68,.4);color:#ef4444}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg class="varvara-avatar" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#312e81"/>
          </radialGradient>
          <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <!-- Glow -->
        <circle cx="22" cy="22" r="22" fill="url(#glowGrad)"/>
        <!-- Outer ring rotating -->
        <circle cx="22" cy="22" r="20" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="5 3" stroke-opacity="0.35">
          <animateTransform attributeName="transform" type="rotate" values="0 22 22;360 22 22" dur="12s" repeatCount="indefinite"/>
        </circle>
        <!-- Face circle -->
        <circle cx="22" cy="22" r="17" fill="url(#bgGrad)">
          <animate attributeName="r" values="17;17.4;17" dur="3.5s" repeatCount="indefinite"/>
        </circle>
        <!-- Hair -->
        <ellipse cx="22" cy="12" rx="8" ry="5" fill="#1e1b4b"/>
        <rect x="14" y="11" width="3" height="8" rx="1.5" fill="#1e1b4b"/>
        <rect x="27" y="11" width="3" height="8" rx="1.5" fill="#1e1b4b"/>
        <!-- Face skin -->
        <circle cx="22" cy="19" r="7" fill="#fde8d0"/>
        <!-- Eyes -->
        <ellipse cx="19.2" cy="18.5" rx="1.2" ry="1.3" fill="#312e81">
          <animate attributeName="ry" values="1.3;0.15;1.3" keyTimes="0;0.5;1" dur="4s" begin="1s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="24.8" cy="18.5" rx="1.2" ry="1.3" fill="#312e81">
          <animate attributeName="ry" values="1.3;0.15;1.3" keyTimes="0;0.5;1" dur="4s" begin="1s" repeatCount="indefinite"/>
        </ellipse>
        <!-- Smile -->
        <path d="M19.5 21.5 Q22 23.5 24.5 21.5" stroke="#c77d5a" stroke-width="1" fill="none" stroke-linecap="round"/>
        <!-- Shoulders -->
        <ellipse cx="22" cy="34" rx="10" ry="6" fill="#4f46e5"/>
      </svg>
      <div>
        <span class="logo-text">Варвара</span>
        <span class="logo-sub">CPO-помощник</span>
      </div>
    </div>
    <div class="sidebar-section-label">Проекты</div>
    <div class="projects-list" id="projectsList"></div>
    <div class="sidebar-footer">
      <button class="btn-add-project" onclick="openAddProjectModal()"><span>+</span> Новый проект</button>
    </div>
  </aside>
  <main class="main">
    <div class="project-header">
      <div class="project-title">
        <span class="project-title-icon" id="headerIcon">⚡</span>
        <span class="project-title-name" id="headerName">Выберите проект</span>
      </div>
      <div class="tabs">
        <button class="tab active" id="tabBtnChat" onclick="switchTab('chat')">Чат</button>
        <button class="tab" id="tabBtnTasks" onclick="switchTab('tasks')">Задачи</button>
      </div>
    </div>
    <div class="tab-content active" id="tabChat">
      <div class="chat-messages" id="chatMessages">
        <div class="empty-state"><div class="empty-state-icon">💬</div><div class="empty-state-text">Выберите проект слева</div></div>
      </div>
      <div class="chat-input-area">
        <textarea id="chatInput" placeholder="Написать Варваре..." rows="1"
          onkeydown="handleChatKey(event)" oninput="autoResize(this)"></textarea>
        <button class="btn-send" id="btnSend" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
    <div class="tab-content" id="tabTasks">
      <div class="kanban-wrapper">
        <div class="kanban-toolbar">
          <button class="btn-primary" onclick="showAddTaskPanel()">+ Задача</button>
        </div>
        <div class="kanban-board" id="kanbanBoard">
          <div class="empty-state" style="flex:1;min-height:300px">
            <div class="empty-state-icon">📋</div><div class="empty-state-text">Выберите проект слева</div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay hidden" id="modalOverlay" onclick="closeModalOnBackdrop(event)">
  <div class="modal">
    <h3>Новый проект</h3>
    <div class="modal-field">
      <label>Название</label>
      <input type="text" id="newProjectName" placeholder="Например: Щенячий патруль"
        onkeydown="if(event.key==='Enter')createProject()">
    </div>
    <div class="modal-field">
      <label>Иконка</label>
      <div class="modal-icons" id="iconPicker"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-modal-cancel" onclick="closeModal()">Отмена</button>
      <button class="btn-modal-create" onclick="createProject()">Создать</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
marked.setOptions({breaks:true,gfm:true});
const ICONS=['🚀','📱','🎯','🐾','📚','🔮','💡','🛠️','🎨','📊','🌟','⚙️','🏗️','🤖','💼','📁'];
const MAX_VISIBLE=5;
const state={projects:[],currentProjectId:null,tasks:[],activeTab:'chat',isSending:false,showAll:false,selectedIcon:ICONS[0]};

async function init(){
  renderIconPicker();
  await loadProjects();
  if(state.projects.length>0) await selectProject(state.projects[0].id);
}

async function loadProjects(){
  const res=await fetch('/api/projects');
  state.projects=await res.json();
  renderSidebar();
}

function renderSidebar(){
  const list=document.getElementById('projectsList');
  const visible=state.showAll?state.projects:state.projects.slice(0,MAX_VISIBLE);
  const hiddenCount=state.projects.length-MAX_VISIBLE;
  list.innerHTML=visible.map(p=>`<div class="project-item ${p.id===state.currentProjectId?'active':''}" onclick="selectProject('${p.id}')">
    <span class="project-item-icon">${p.icon}</span>
    <span class="project-item-name">${escHtml(p.name)}</span>
  </div>`).join('');
  if(state.projects.length>MAX_VISIBLE&&!state.showAll){
    list.innerHTML+=`<div class="sidebar-hidden-toggle" onclick="state.showAll=true;renderSidebar()">··· ещё ${hiddenCount}</div>`;
  }
}

async function selectProject(id){
  state.currentProjectId=id;
  const p=state.projects.find(x=>x.id===id);
  if(!p)return;
  document.getElementById('headerIcon').textContent=p.icon;
  document.getElementById('headerName').textContent=p.name;
  document.getElementById('chatInput').placeholder=`Написать Варваре про «${p.name}»...`;
  renderSidebar();
  await loadTasks();
  renderChatHistory();
}

async function loadTasks(){
  if(!state.currentProjectId)return;
  const res=await fetch(`/api/tasks?projectId=${state.currentProjectId}`);
  state.tasks=await res.json();
  renderKanban();
}

function renderKanban(){
  const project=state.projects.find(p=>p.id===state.currentProjectId);
  if(!project)return;
  const board=document.getElementById('kanbanBoard');
  board.innerHTML=project.columns.map((col,colIdx)=>{
    const cards=state.tasks.filter(t=>t.column===col);
    const isFirst=colIdx===0,isLast=colIdx===project.columns.length-1;
    const safeCol=col.replace(/'/g,"\\'");
    return `<div class="kanban-column">
      <div class="column-header">
        <span class="column-title">${escHtml(col)}</span>
        <span class="column-count">${cards.length}</span>
      </div>
      <div class="column-cards">${cards.map(t=>renderCard(t,isFirst,isLast)).join('')}</div>
      <div class="column-add-form">
        <button class="column-add-btn" onclick="showInlineAdd(${colIdx})">+ Задача</button>
        <div class="column-add-input-wrap" id="addForm-${colIdx}">
          <textarea class="column-add-input" id="addInput-${colIdx}" rows="2" placeholder="Название задачи..."
            onkeydown="handleAddKey(event,${colIdx},'${safeCol}')"></textarea>
          <select class="priority-select" id="addPriority-${colIdx}">
            <option value="critical">🔴 Критично</option>
            <option value="high">🟠 Высокий</option>
            <option value="medium" selected>🟡 Средний</option>
            <option value="low">🔵 Низкий</option>
            <option value="someday">⚪ Когда-нибудь</option>
          </select>
          <div class="column-add-actions">
            <button class="btn-save-task" onclick="saveInlineTask(${colIdx},'${safeCol}')">Добавить</button>
            <button class="btn-cancel-task" onclick="cancelInlineAdd(${colIdx})">Отмена</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

const PRIORITY_CONFIG={
  critical:{label:'Критично',dot:'🔴'},
  high:{label:'Высокий',dot:'🟠'},
  medium:{label:'Средний',dot:'🟡'},
  low:{label:'Низкий',dot:'🔵'},
  someday:{label:'Когда-нибудь',dot:'⚪'}
};
const PRIORITY_ORDER=['critical','high','medium','low','someday'];

function renderCard(task,isFirst,isLast){
  const date=new Date(task.createdAt).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
  const p=task.priority||'medium';
  const pc=PRIORITY_CONFIG[p]||PRIORITY_CONFIG.medium;
  return `<div class="task-card">
    <div class="task-card-header">
      <div class="task-card-title" contenteditable="true"
        onblur="saveCardTitle('${task.id}',this)"
        onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${escHtml(task.title)}</div>
      <button class="task-card-delete" onclick="deleteTask('${task.id}')">×</button>
    </div>
    ${task.agent?`<div class="task-card-agent">${escHtml(task.agent)}</div>`:''}
    <div class="task-card-footer">
      <span class="priority-badge ${p}" onclick="cyclePriority('${task.id}','${p}')" title="Нажми для смены приоритета">${pc.dot} ${pc.label}</span>
      <div style="display:flex;align-items:center;gap:6px">
        <span class="task-card-date">${date}</span>
        <div class="task-card-nav">
          <button class="task-nav-btn" onclick="moveTask('${task.id}',-1)" ${isFirst?'disabled':''}>←</button>
          <button class="task-nav-btn" onclick="moveTask('${task.id}',1)" ${isLast?'disabled':''}>→</button>
        </div>
      </div>
    </div>
  </div>`;
}

async function cyclePriority(taskId,current){
  const idx=PRIORITY_ORDER.indexOf(current);
  const next=PRIORITY_ORDER[(idx+1)%PRIORITY_ORDER.length];
  await fetch(`/api/tasks/${taskId}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({priority:next})});
  const task=state.tasks.find(t=>t.id===taskId);
  if(task){task.priority=next;renderKanban();}
}

function showInlineAdd(colIdx){
  const form=document.getElementById(`addForm-${colIdx}`);
  form.previousElementSibling.style.display='none';
  form.classList.add('visible');
  document.getElementById(`addInput-${colIdx}`).focus();
}
function cancelInlineAdd(colIdx){
  const form=document.getElementById(`addForm-${colIdx}`);
  form.previousElementSibling.style.display='';
  form.classList.remove('visible');
  document.getElementById(`addInput-${colIdx}`).value='';
}
function handleAddKey(e,colIdx,col){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();saveInlineTask(colIdx,col);}
  if(e.key==='Escape')cancelInlineAdd(colIdx);
}
async function saveInlineTask(colIdx,col){
  const input=document.getElementById(`addInput-${colIdx}`);
  const title=input.value.trim();
  if(!title)return;
  const priority=document.getElementById(`addPriority-${colIdx}`)?.value||'medium';
  await createTask(title,col,priority);
  cancelInlineAdd(colIdx);
}

async function createTask(title,column='Бэклог',priority='medium'){
  const res=await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({projectId:state.currentProjectId,title,column,priority})});
  const task=await res.json();
  state.tasks.unshift(task);
  renderKanban();
  showToast('Задача добавлена','success');
  return task;
}

async function moveTask(taskId,dir){
  const project=state.projects.find(p=>p.id===state.currentProjectId);
  const task=state.tasks.find(t=>t.id===taskId);
  if(!task||!project)return;
  const colIdx=project.columns.indexOf(task.column);
  const newIdx=colIdx+dir;
  if(newIdx<0||newIdx>=project.columns.length)return;
  const newCol=project.columns[newIdx];
  await fetch(`/api/tasks/${taskId}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({column:newCol})});
  task.column=newCol;
  renderKanban();
}

async function deleteTask(taskId){
  await fetch(`/api/tasks/${taskId}`,{method:'DELETE'});
  state.tasks=state.tasks.filter(t=>t.id!==taskId);
  renderKanban();
}

async function saveCardTitle(taskId,el){
  const title=el.textContent.trim();
  if(!title){el.textContent=state.tasks.find(t=>t.id===taskId)?.title||'';return;}
  await fetch(`/api/tasks/${taskId}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})});
  const task=state.tasks.find(t=>t.id===taskId);
  if(task)task.title=title;
}

function showAddTaskPanel(){
  switchTab('tasks');
  setTimeout(()=>{const btn=document.querySelector('.column-add-btn');if(btn)btn.click();},50);
}

function getChatHistory(){
  if(!state.currentProjectId)return[];
  try{return JSON.parse(localStorage.getItem('chat_'+state.currentProjectId)||'[]')}catch{return[]}
}
function saveChatHistory(history){
  if(!state.currentProjectId)return;
  localStorage.setItem('chat_'+state.currentProjectId,JSON.stringify(history.slice(-50)));
}

function renderChatHistory(){
  const msgs=getChatHistory();
  const container=document.getElementById('chatMessages');
  const project=state.projects.find(p=>p.id===state.currentProjectId);
  if(msgs.length===0){
    container.innerHTML=`<div class="empty-state"><div class="empty-state-icon">${project?.icon||'💬'}</div><div class="empty-state-text">Начни диалог с Варварой про «${escHtml(project?.name||'')}»</div></div>`;
    return;
  }
  container.innerHTML=msgs.map(m=>renderMessage(m.role,m.content)).join('');
  scrollToBottom();
}

function renderMessage(role,content){
  const avatar=role==='user'?'👤':'⚡';
  const html=role==='assistant'?marked.parse(content):escHtml(content).replace(/\n/g,'<br>');
  return `<div class="message ${role}"><div class="message-avatar">${avatar}</div><div class="message-bubble">${html}</div></div>`;
}
function scrollToBottom(){const c=document.getElementById('chatMessages');requestAnimationFrame(()=>{c.scrollTop=c.scrollHeight});}
function handleChatKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,150)+'px';}

async function sendMessage(){
  if(state.isSending)return;
  const input=document.getElementById('chatInput');
  const message=input.value.trim();
  if(!message||!state.currentProjectId)return;
  state.isSending=true;
  document.getElementById('btnSend').disabled=true;
  input.value='';input.style.height='auto';
  const history=getChatHistory();
  const container=document.getElementById('chatMessages');
  if(container.querySelector('.empty-state'))container.innerHTML='';
  container.insertAdjacentHTML('beforeend',renderMessage('user',message));
  scrollToBottom();
  const thinkId='think-'+Date.now();
  container.insertAdjacentHTML('beforeend',`<div class="thinking-indicator" id="${thinkId}"><div class="thinking-dots"><span></span><span></span><span></span></div><span id="${thinkId}-t">Думает...</span></div>`);
  scrollToBottom();
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message,history,projectId:state.currentProjectId})});
    const reader=res.body.getReader();
    const decoder=new TextDecoder();
    let buf='';
    while(true){
      const{done,value}=await reader.read();
      if(done)break;
      buf+=decoder.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        try{
          const p=JSON.parse(line.slice(6));
          if(p.thinking){const el=document.getElementById(`${thinkId}-t`);if(el)el.textContent=`Думает ${p.thinking}с...`;}
          else if(p.text!==undefined){
            document.getElementById(thinkId)?.remove();
            container.insertAdjacentHTML('beforeend',renderMessage('assistant',p.text));
            saveChatHistory([...history,{role:'user',content:message},{role:'assistant',content:p.text}]);
            if(p.action?.type==='CREATE_TASK'){
              await createTask(p.action.data.title,'Бэклог');
              container.insertAdjacentHTML('beforeend',`<div class="task-created-notice">✓ Задача добавлена: «${escHtml(p.action.data.title)}»</div>`);
            }
            scrollToBottom();
          }else if(p.error){
            document.getElementById(thinkId)?.remove();
            container.insertAdjacentHTML('beforeend',renderMessage('assistant',`Ошибка: ${escHtml(p.error)}`));
            scrollToBottom();
          }
        }catch(_){}
      }
    }
  }catch(e){
    document.getElementById(thinkId)?.remove();
    container.insertAdjacentHTML('beforeend',renderMessage('assistant','Ошибка соединения с сервером'));
    scrollToBottom();
  }
  state.isSending=false;
  document.getElementById('btnSend').disabled=false;
  input.focus();
}

function switchTab(tab){
  state.activeTab=tab;
  document.getElementById('tabChat').classList.toggle('active',tab==='chat');
  document.getElementById('tabTasks').classList.toggle('active',tab==='tasks');
  document.getElementById('tabBtnChat').classList.toggle('active',tab==='chat');
  document.getElementById('tabBtnTasks').classList.toggle('active',tab==='tasks');
}

function renderIconPicker(){
  state.selectedIcon=ICONS[0];
  document.getElementById('iconPicker').innerHTML=ICONS.map((ic,i)=>
    `<button class="icon-option ${i===0?'selected':''}" onclick="selectIcon('${ic}',this)">${ic}</button>`).join('');
}
function selectIcon(icon,el){
  state.selectedIcon=icon;
  document.querySelectorAll('.icon-option').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
}
function openAddProjectModal(){
  document.getElementById('newProjectName').value='';
  renderIconPicker();
  document.getElementById('modalOverlay').classList.remove('hidden');
  setTimeout(()=>document.getElementById('newProjectName').focus(),50);
}
function closeModal(){document.getElementById('modalOverlay').classList.add('hidden');}
function closeModalOnBackdrop(e){if(e.target.id==='modalOverlay')closeModal();}

async function createProject(){
  const name=document.getElementById('newProjectName').value.trim();
  if(!name)return;
  const res=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name,icon:state.selectedIcon})});
  const project=await res.json();
  state.projects.push(project);
  closeModal();renderSidebar();
  await selectProject(project.id);
  showToast(`Проект «${name}» создан`,'success');
}

let toastTimer;
function showToast(msg,type=''){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className=`toast ${type} show`;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3000);
}
function escHtml(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
init();
</script>
</body>
